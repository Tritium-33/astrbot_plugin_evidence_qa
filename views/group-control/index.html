<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>群聊控制</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">发言权限</p><h1>群聊控制</h1>
        <p class="subtitle">点击开关即保存。开启后，继续遵守接话、主人暂停和限流规则。</p></div>
      <button id="refresh" class="secondary" disabled>刷新群列表</button>
    </header>
    <div id="notice" role="status" aria-live="polite">正在连接 AstrBot…</div>
    <section class="board" aria-label="群聊开关">
      <div class="toolbar">
        <input id="search" type="search" placeholder="搜索群名、群号或平台" aria-label="搜索群聊">
        <span id="count" class="muted"></span>
      </div>
      <div class="batch">
        <label><input id="select-all" type="checkbox"> 选择当前列表</label>
        <span class="spacer"></span>
        <button id="enable-selected" class="secondary" disabled>开启选中</button>
        <button id="disable-selected" class="secondary" disabled>关闭选中</button>
      </div>
      <div id="groups" aria-live="polite"></div>
    </section>
    <details>
      <summary>添加群号</summary>
      <p class="muted">未出现在群列表中的群，也可以先登记开关。</p>
      <form id="add-group">
        <select id="platform" aria-label="QQ 平台" required></select>
        <input id="group-id" inputmode="numeric" pattern="[1-9][0-9]{4,15}" placeholder="群号" aria-label="群号" required>
        <button type="submit" id="add-button" class="secondary" disabled>添加并关闭</button>
      </form>
    </details>
    <p class="footnote">关闭后，主人、@、关键词和免冷却群均不例外。已交给 QQ 发送的消息不会撤回。</p>
    <noscript>请启用 JavaScript，并在 AstrBot 的插件视图中打开此页面。</noscript>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
